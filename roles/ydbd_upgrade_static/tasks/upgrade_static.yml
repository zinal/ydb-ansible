---
# YDB single static node upgrade tasks

- name: Create the YDB server binary directory
  file:
    state: directory
    path: "{{ ydb_dir }}/release/{{ ydb_version }}"
    group: bin
    owner: root
    mode: '0755'
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true

- name: Install the YDB server binary package
  ansible.builtin.unarchive:
    creates: "{{ ydb_dir }}/release/{{ ydb_version }}/bin/ydbd"
    dest: "{{ ydb_dir }}/release/{{ ydb_version }}"
    group: bin
    owner: root
    src: "{{ ydb_archive }}"
    extra_opts: "{{ ydb_unpack_options }}"
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true

- name: Symlink the YDB binaries
  file:
    path: "{{ ydb_dir }}/bin"
    src: "./release/{{ ydb_version }}/bin"
    state: link
    force: yes
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true

- name: Symlink the YDB libraries
  file:
    path: "{{ ydb_dir }}/lib"
    src: "./release/{{ ydb_version }}/lib"
    state: link
    force: yes
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true

- name: Restart the storage node at {{ snode_name }}
  ansible.builtin.systemd:
    state: restarted
    name: ydbd-storage
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true

- name: Wait for storage state recovery on {{ snode_name }}
  delegate_to: "{{ snode_name }}"
  delegate_facts: true
  any_errors_fatal: true
  block:
    - name: Transfer the secrets to {{ snode_name }}
      ansible.builtin.copy:
        src: secret
        dest: "{{ ydb_dir }}/certs/secret"
        group: ydb
        owner: ydb
        mode: '0700'
    - name: Run wait command on {{ snode_name }}
      command: "{{ ydb_dir }}/home/wait_normal.sh {{ snode_name }}"
      become: true
      become_user: ydb
  always:
    - name: Cleanup the transferred secrets on {{ snode_name }}
      ansible.builtin.file: state=absent path={{ ydb_dir }}/certs/secret
